<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free AI Assistant</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        @keyframes pulse-dots {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
        .dot-1 { animation: pulse-dots 1.4s infinite 0s; }
        .dot-2 { animation: pulse-dots 1.4s infinite 0.2s; }
        .dot-3 { animation: pulse-dots 1.4s infinite 0.4s; }
    </style>
</head>
<body class="bg-slate-100 font-sans h-screen flex flex-col justify-between antialiased selection:bg-emerald-500 selection:text-white">

    <!-- Header Section -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-10 shadow-sm">
        <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-500 to-teal-600 flex items-center justify-center text-white shadow-md">
                    <i class="fa-solid font-bold text-lg fa-robot"></i>
                </div>
                <div>
                    <h1 class="font-bold text-slate-800 text-lg sm:text-xl leading-tight">Free AI Assistant</h1>
                    <p class="text-xs text-slate-500">Advanced AI Engine (Live Ready)</p>
                </div>
            </div>
            
            <button id="newChatBtn" onclick="resetChat()" class="flex items-center space-x-1.5 px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs sm:text-sm font-medium rounded-lg transition-colors border border-slate-300">
                <i class="fa-solid fa-plus"></i>
                <span class="hidden sm:inline">নতুন চ্যাট</span>
            </button>
        </div>
    </header>

    <!-- Main Chat Area -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-4 flex flex-col min-h-0">
        
        <!-- Messages Scroll Container -->
        <div id="chatMessages" class="flex-1 overflow-y-auto space-y-4 pr-1 pb-4">
            
            <!-- Welcome Message -->
            <div class="flex items-start space-x-3 max-w-[85%] sm:max-w-[75%]">
                <div class="w-8 h-8 rounded-full bg-emerald-600 flex-shrink-0 flex items-center justify-center text-white text-xs font-bold shadow">
                    AI
                </div>
                <div class="bg-white p-3.5 rounded-2xl rounded-tl-none border border-slate-200 shadow-sm text-slate-800 text-sm leading-relaxed">
                    👋 <strong>স্বাগতম!</strong> আমি আপনার ফ্রি AI Assistant। <br><br>
                    আমি Data Entry, Excel সূত্র, Freelancing এবং যেকোনো সাধারণ প্রশ্নের উত্তর দিতে প্রস্তুত। নিচের দ্রুত প্রশ্নের বোতামগুলোতে ক্লিক করুন অথবা আপনার প্রশ্ন লিখুন!
                </div>
            </div>

        </div>

        <!-- Typing Indicator -->
        <div id="typingIndicator" class="hidden mb-3">
            <div class="flex items-center space-x-3 max-w-[85%]">
                <div class="w-8 h-8 rounded-full bg-emerald-600 flex-shrink-0 flex items-center justify-center text-white text-xs font-bold">
                    AI
                </div>
                <div class="bg-white px-4 py-2.5 rounded-2xl rounded-tl-none border border-slate-200 shadow-sm text-slate-500 text-xs flex items-center space-x-1.5">
                    <span>AI উত্তর তৈরি করছে...</span>
                    <span class="flex space-x-0.5">
                        <span class="dot-1 h-1.5 w-1.5 bg-slate-500 rounded-full"></span>
                        <span class="dot-2 h-1.5 w-1.5 bg-slate-500 rounded-full"></span>
                        <span class="dot-3 h-1.5 w-1.5 bg-slate-500 rounded-full"></span>
                    </span>
                </div>
            </div>
        </div>

        <!-- Input & Quick Actions Container -->
        <div class="mt-auto pt-2">
            
            <!-- Quick Action Preset Buttons -->
            <div class="mb-2.5 flex items-center space-x-2 overflow-x-auto pb-1 text-xs">
                <span class="text-slate-400 font-medium whitespace-nowrap text-[11px]"><i class="fa-solid fa-bolt text-amber-500 mr-1"></i> দ্রুত প্রশ্ন:</span>
                
                <button onclick="applyPreset('ডাটা এন্ট্রি কাজের সুযোগ ও সেরা টিপস কী কী?')" class="whitespace-nowrap px-3 py-1.5 bg-white hover:bg-emerald-50 text-slate-700 hover:text-emerald-700 border border-slate-200 hover:border-emerald-300 rounded-full transition-all shadow-sm flex items-center space-x-1">
                    <span>📊 Data Entry</span>
                </button>
                
                <button onclick="applyPreset('Excel-এ VLOOKUP ও XLOOKUP সূত্রের মধ্যে পার্থক্য কী?')" class="whitespace-nowrap px-3 py-1.5 bg-white hover:bg-emerald-50 text-slate-700 hover:text-emerald-700 border border-slate-200 hover:border-emerald-300 rounded-full transition-all shadow-sm flex items-center space-x-1">
                    <span>📈 Excel Formula</span>
                </button>
                
                <button onclick="applyPreset('Upwork ও Fiverr-এ প্রথম জব পাওয়ার সেরা উপায়গুলো কী?')" class="whitespace-nowrap px-3 py-1.5 bg-white hover:bg-emerald-50 text-slate-700 hover:text-emerald-700 border border-slate-200 hover:border-emerald-300 rounded-full transition-all shadow-sm flex items-center space-x-1">
                    <span>💼 Freelancing Tips</span>
                </button>
            </div>

            <!-- Input Box & Send Button -->
            <form id="chatForm" onsubmit="handleSend(event)" class="relative flex items-center">
                <input 
                    type="text" 
                    id="userInput" 
                    placeholder="বাংলা বা ইংরেজিতে প্রশ্ন লিখুন..." 
                    class="w-full pl-4 pr-12 py-3 bg-white border border-slate-300 rounded-2xl focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent shadow-sm text-sm text-slate-800 placeholder-slate-400"
                    autocomplete="off"
                >
                <button 
                    type="submit" 
                    id="sendBtn"
                    class="absolute right-2 w-9 h-9 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl flex items-center justify-center transition-colors shadow-sm focus:outline-none"
                    title="Send"
                >
                    <i class="fa-solid fa-paper-plane text-xs"></i>
                </button>
            </form>
        </div>

    </main>

    <!-- JavaScript Logic -->
    <script>
        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const typingIndicator = document.getElementById('typingIndicator');

        function applyPreset(text) {
            userInput.value = text;
            userInput.focus();
        }

        async function handleSend(event) {
            event.preventDefault();
            const query = userInput.value.trim();
            if (!query) return;

            appendUserMessage(query);
            userInput.value = '';
            showTyping(true);

            // Simulate intelligent processing delay
            setTimeout(() => {
                showTyping(false);
                const aiResponse = generateSmartResponse(query);
                appendAIMessage(aiResponse);
            }, 1000);
        }

        function generateSmartResponse(query) {
            const lower = query.toLowerCase();

            if (lower.includes('ডাটা এন্ট্রি') || lower.includes('data entry')) {
                return `<strong>📊 Data Entry কাজের পূর্ণাঙ্গ নির্দেশিকা:</strong><br><br>
                ১. <strong>প্রয়োজনীয় দক্ষতা:</strong> টাইপিং স্পিড (প্রতি মিনিটে অন্তত ৪০ শব্দ), মাইক্রোসফট এক্সেল এবং গুগল শিটসের বেসিক থেকে অ্যাডভান্সড কাজ জানা।<br>
                ২. <strong>কোথায় কাজ পাবেন:</strong> Upwork, Fiverr, Freelancer এবং PeoplePerHour-এ ডাটা এন্ট্রি, কপি-পেস্ট ও ওয়েব রিসার্চের প্রচুর কাজ রয়েছে।<br>
                ৩. <strong>সাফল্যের টিপস:</strong> কাজ জমা দেওয়ার আগে নিখুঁতভাবে প্রুফরিডিং বা ভুল সংশোধন করে নেওয়া অত্যন্ত জরুরি।`;
            } 
            else if (lower.includes('excel') || lower.includes('vlookup') || lower.includes('xlookup') || lower.includes('সূত্র')) {
                return `<strong>📈 Excel Formula ও টিপস:</strong><br><br>
                • <strong>VLOOKUP:</strong> নির্দিষ্ট কোনো টেবিল থেকে কলাম ধরে ডেটা খুঁজতে ব্যবহার করা হয়।<br>
                <code>=VLOOKUP(lookup_value, table_array, col_index_num, [range_lookup])</code><br><br>
                • <strong>XLOOKUP:</strong> এটি ভি-লুকআপের চেয়েও আধুনিক ও সহজ সংস্করণ, যা যেকোনো দিক থেকে ডেটা খুঁজতে পারে।`;
            } 
            else if (lower.includes('freelance') || lower.includes('ফ্রিল্যান্সিং') || lower.includes('upwork') || lower.includes('fiverr')) {
                return `<strong>💼 Freelancing সফলতার উপায়:</strong><br><br>
                ১. যেকোনো একটি নির্দিষ্ট ক্যাটাগরিতে (যেমন: Data Entry, Web Research বা Graphic Design) এক্সপার্ট হন।<br>
                ২. আকর্ষণীয় পোর্টফোলিও তৈরি করে প্রোফাইল সাজান।<br>
                ৩. ক্লায়েন্টের প্রপোজাল পাঠানোর সময় তাদের সমস্যা সমাধানে আপনি কীভাবে সাহায্য করতে পারবেন তা স্পষ্টভাবে তুলে ধরুন।`;
            } 
            else {
                return `ধন্যবাদ আপনার চমৎকার প্রশ্নটির জন্য: <em>"${escapeHtml(query)}"</em><br><br>
                💡 <strong>এআই অ্যাসিস্ট্যান্টের পরামর্শ:</strong> আপনার এই বিষয়টি নিয়ে নিয়মিত চর্চা করলে খুব দ্রুত ভালো ফলাফল পাওয়া সম্ভব। আপনি চাইলে নির্দিষ্ট কোনো বিষয়ে আরও বিস্তারিত জানতে আমাকে প্রশ্ন করতে পারেন!`;
            }
        }

        function appendUserMessage(text) {
            const msgHTML = `
                <div class="flex items-start justify-end space-x-3 max-w-[85%] sm:max-w-[75%] ml-auto">
                    <div class="bg-emerald-600 p-3.5 rounded-2xl rounded-tr-none text-white text-sm leading-relaxed shadow-sm">
                        ${escapeHtml(text)}
                    </div>
                    <div class="w-8 h-8 rounded-full bg-slate-700 flex-shrink-0 flex items-center justify-center text-white text-xs font-bold shadow">
                        আপনি
                    </div>
                </div>
            `;
            chatMessages.insertAdjacentHTML('beforeend', msgHTML);
            scrollToBottom();
        }

        function appendAIMessage(text) {
            const msgHTML = `
                <div class="flex items-start space-x-3 max-w-[85%] sm:max-w-[75%]">
                    <div class="w-8 h-8 rounded-full bg-emerald-600 flex-shrink-0 flex items-center justify-center text-white text-xs font-bold shadow">
                        AI
                    </div>
                    <div class="bg-white p-3.5 rounded-2xl rounded-tl-none border border-slate-200 shadow-sm text-slate-800 text-sm leading-relaxed">
                        ${text}
                    </div>
                </div>
            `;
            chatMessages.insertAdjacentHTML('beforeend', msgHTML);
            scrollToBottom();
        }

        function showTyping(show) {
            if (show) {
                typingIndicator.classList.remove('hidden');
            } else {
                typingIndicator.classList.add('hidden');
            }
            scrollToBottom();
        }

        function scrollToBottom() {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function resetChat() {
            chatMessages.innerHTML = `
                <div class="flex items-start space-x-3 max-w-[85%] sm:max-w-[75%]">
                    <div class="w-8 h-8 rounded-full bg-emerald-600 flex-shrink-0 flex items-center justify-center text-white text-xs font-bold shadow">
                        AI
                    </div>
                    <div class="bg-white p-3.5 rounded-2xl rounded-tl-none border border-slate-200 shadow-sm text-slate-800 text-sm leading-relaxed">
                        👋 <strong>নতুন চ্যাট শুরু হয়েছে!</strong><br><br>
                        আমি আপনাকে কী বিষয়ে সাহায্য করতে পারি?
                    </div>
                </div>
            `;
            userInput.value = '';
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
